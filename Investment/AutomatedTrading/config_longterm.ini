[trading]
; 20 Portfolio Symbols
symbols = AAPL, MSFT, GOOGL, AMZN, NVDA, LRCX, TSLA, AZN, IONQ, BABA, LI, QBTS, NTDOY, ABNB, C, NFLX, DIS, LMND, SHOP, CRWD

; Output paths specific to Long Term analysis
output_csv = chart_support_longterm_ibkr.csv
whatsapp_notify_state_file = notify_state_longterm.json

; Structural Pivot Settings: 10/10 requires 2 trading weeks of "higher lows" 
; to confirm a support floor, making the levels much stronger.
chart_pivot_left = 10
chart_pivot_right = 10
chart_atr_proximity_mult = 1.25

; Set to false for your manual/scheduled twice-daily run
chart_watch_enabled = false

; Green API — credentials in secrets.local.ini or env vars
whatsapp_enabled = true
whatsapp_id_instance =
whatsapp_api_token_instance =
whatsapp_target_phone =

; Alert logic: 0 cooldown because you only run this twice daily
whatsapp_notify_signals = BUY_HEURISTIC, SELL_HEURISTIC
whatsapp_notify_cooldown_minutes = 0
whatsapp_notify_price_bucket_pct = 0.5

[ibkr]
ibkr_data_source = client_portal
cp_gateway_host = 127.0.0.1
cp_gateway_port = 5000
cp_request_timeout_seconds = 60

; Authentication: compete=true means it logs out your mobile app
cp_ssodh_compete = true
cp_brokerage_auth_wait_seconds = 45

; --- CRITICAL INVESTOR DATA OVERRIDES ---
; Using Daily Bars for 1-Year history ensures high success rate with CP API.
cp_period = 1y
cp_bar = 1d
bar_size = 1 day
duration = 18 M
sec_type = STK
use_rth = true
what_to_show = TRADES

; Pacing: 1.5s is safe for 20 symbols twice a day
request_pause_seconds = 1.5

; Pivot logic matching the 10/10 daily bar strategy
pivot_left = 10
pivot_right = 10
atr_proximity_mult = 1.25
min_bars_recommended = 250